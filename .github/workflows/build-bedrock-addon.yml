name: Build Bedrock Minimap Add-on

on:
  push:
    branches:
      - feature/bedrock-minimap-addon
    paths:
      - "MinecraftMinimap_BP/**"
      - ".github/workflows/build-bedrock-addon.yml"
  workflow_dispatch:

jobs:
  package-addon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        run: python3 -m json.tool MinecraftMinimap_BP/manifest.json > /dev/null

      - name: Package mcaddon
        run: |
          mkdir -p dist
          cd MinecraftMinimap_BP
          zip -r ../dist/SurvivalAI-Live-Minimap.mcaddon .

      - name: Upload add-on
        uses: actions/upload-artifact@v4
        with:
          name: SurvivalAI-Live-Minimap
          path: dist/SurvivalAI-Live-Minimap.mcaddon
          if-no-files-found: error
          retention-days: 30
